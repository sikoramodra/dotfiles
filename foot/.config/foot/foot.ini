[main]
include=~/.config/omarchy/current/theme/foot.ini
term=xterm-256color
shell=zsh
font=Source Code Pro:size=9
pad=1x0 center
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[url]
label-letters=hjklasdf

[key-bindings]
clipboard-copy=Control+Shift+c Control+Insert
primary-paste=none
clipboard-paste=Control+Shift+v Shift+Insert
unicode-input=none
show-urls-copy=Control+Shift+k

[text-bindings]
